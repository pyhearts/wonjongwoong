<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKING 1000 SEATS COMPETITION</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    :root {
      --green:      #00ff41;
      --green-dim:  #00b32d;
      --green-dark: #003b00;
      --green-glow: rgba(0,255,65,0.4);
      --bg:         #000000;
      --bg2:        #0a0a0a;
      --bg3:        #0d1a0d;
    }

    body {
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header, .main { position: relative; z-index: 1; }

    header {
      z-index: 2;
      background: rgba(0,0,0,0.92);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 -1px 0 var(--green);
    }

    header h1 {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: var(--green);
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--green), 0 0 30px var(--green-glow);
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-inline-start: auto;
    }
    [hidden] { display: none !important; }
    .btn.account-button { width: auto; padding: 0 12px; letter-spacing: 0; text-transform: none; }
    .account-controls {
      position: relative;
      display: flex;
      justify-content: flex-end;
      min-width: 0;
      margin-inline-start: auto;
    }
    .account-summary, .profile-preview { display: flex; align-items: center; gap: 8px; }
    .btn.account-summary { max-width: min(250px, calc(100vw - 48px)); font-size: 0.95rem; }
    .account-summary .lb-dot { flex: none; }
    #account-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .account-panel {
      position: absolute;
      z-index: 2;
      top: calc(100% + 6px);
      right: 0;
      display: grid;
      gap: 4px;
      width: 160px;
      padding: 6px;
      background: #050f05;
      border: 1px solid var(--green-dim);
      box-shadow: 0 4px 18px #000;
    }
    .account-panel button {
      min-height: 40px;
      padding: 8px 10px;
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .account-panel button:not(:disabled):is(:hover, :focus-visible) { background: #102710; border-color: var(--green-dim); }
    .account-panel button:disabled { opacity: 0.6; cursor: default; }
    .account-feedback { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 24px; }
    .account-feedback:has(#account-notice:not(:empty), #retry-profile:not([hidden])) { margin-top: 12px; }
    #retry-profile { height: 34px; font-size: 0.9rem; }

    /* 상태 뱃지 + 버튼 공통 크기 */
    .status-badge,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 40px;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid currentColor;
    }

    .status-badge {
      pointer-events: none;
    }
    .status-badge.active {
      color: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow), inset 0 0 10px rgba(0,255,65,0.1);
      text-shadow: 0 0 8px var(--green);
      animation: blink-badge 1.5s infinite;
    }
    .status-badge.inactive {
      color: #1a4d1a;
      border-color: #1a4d1a;
    }
    @keyframes blink-badge {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }

    .btn {
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:hover { color: #000; text-shadow: none; }
    .btn span { position: relative; z-index: 1; }
    .btn:disabled { opacity: 0.55; cursor: default; pointer-events: none; }

    .btn-start { color: var(--green); border-color: var(--green); }
    .btn-start::before { background: var(--green); }
    .btn-start:hover { box-shadow: 0 0 15px var(--green-glow); }

    .btn-stop { color: #aaff00; border-color: #aaff00; }
    .btn-stop::before { background: #aaff00; }
    .btn-stop:hover { box-shadow: 0 0 15px rgba(170,255,0,0.5); }

    .btn-reset { color: #ff0040; border-color: #ff0040; }
    .btn-reset::before { background: #ff0040; }
    .btn-reset:hover { box-shadow: 0 0 15px rgba(255,0,64,0.5); }

    .main {
      display: flex;
      gap: 16px;
      padding: 16px;
      align-items: flex-start;
    }

    .grid-wrap { flex: 1; min-width: 0; }

    .grid-info {
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--green-dim);
      letter-spacing: 1px;
    }
    .grid-info span { color: var(--green); text-shadow: 0 0 6px var(--green); }

    .grid-scroll {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .grid-scroll::-webkit-scrollbar { width: 4px; }
    .grid-scroll::-webkit-scrollbar-track { background: #000; }
    .grid-scroll::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }

    #grid {
      display: grid;
      grid-template-columns: repeat(25, minmax(0, 28px));
      gap: 3px;
    }

    .seat {
      width: 28px;
      max-width: 100%;
      height: 28px;
      background: #0a1a0a;
      border: 1px solid #00cc33;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
    }
    .seat:hover:not(.claimed):not(.inactive) {
      background: #00ff41;
      border-color: #00ff41;
      box-shadow: 0 0 8px #00ff41;
      z-index: 2;
      transform: scale(1.35);
    }
    .seat.claimed {
      cursor: default;
      border-color: transparent;
    }
    .seat.claimed:hover {
      transform: scale(1.35);
      z-index: 2;
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
    .seat.inactive {
      cursor: not-allowed;
      opacity: 0.4;
    }
    .seat.inactive:hover { transform: none; box-shadow: none; }

    /* 예약자 이름 말풍선 */
    #seat-tooltip {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      max-width: min(280px, calc(100vw - 16px));
      max-height: calc(100vh - 16px);
      overflow: hidden;
      overflow-wrap: anywhere;
      padding: 8px 12px;
      background: #000;
      border: 1px solid var(--green);
      color: var(--green);
      font-size: 0.85rem;
      line-height: 1.5;
      box-shadow: 0 0 12px var(--green-glow);
    }

    /* Leaderboard */
    .leaderboard {
      width: 210px;
      min-width: 190px;
      background: rgba(0,0,0,0.9);
      border: 1px solid var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px rgba(0,255,65,0.03);
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
    }

    .lb-header {
      background: var(--green-dark);
      padding: 12px;
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: var(--green);
      letter-spacing: 4px;
      border-bottom: 1px solid var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    .lb-stats {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--green-dim);
      border-bottom: 1px solid #0a2a0a;
      letter-spacing: 1px;
    }
    .lb-stats .highlight { color: var(--green); text-shadow: 0 0 6px var(--green); }

    #lb-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    #lb-list::-webkit-scrollbar { width: 3px; }
    #lb-list::-webkit-scrollbar-track { background: #000; }
    #lb-list::-webkit-scrollbar-thumb { background: var(--green-dim); }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid #0a1a0a;
      transition: background 0.1s;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }
    .lb-item:hover { background: rgba(0,255,65,0.05); }

    .lb-rank {
      font-family: 'VT323', monospace;
      font-size: 1rem;
      color: #1a5c1a;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .lb-rank.gold   { color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.6); }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }

    .lb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    .lb-identity { flex: 1; min-width: 0; }
    .lb-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--green); }
    .lb-email { margin-top: 3px; color: #a1c6a9; overflow-wrap: anywhere; letter-spacing: 0; }
    .lb-count { font-family: 'VT323', monospace; font-size: 1rem; color: var(--green); flex-shrink: 0; text-shadow: 0 0 6px var(--green); }
    #leaderboard-email-error { padding: 8px 12px; font-size: 0.8rem; color: #a1c6a9; }
    #leaderboard-email-error p { margin-bottom: 6px; }
    #retry-leaderboard-emails { height: 32px; font-size: 0.8rem; }

    /* Modals */
    .modal {
      background: #000;
      border: 1px solid var(--green);
      padding: 30px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 0 40px var(--green-glow), inset 0 0 40px rgba(0,255,65,0.03);
      animation: popIn 0.15s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.9) translateY(-10px); opacity: 0; }
      to   { transform: scale(1) translateY(0);       opacity: 1; }
    }

    .modal h2 {
      margin-bottom: 18px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      color: var(--green);
      text-align: center;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--green);
    }
    #claim-title { margin-bottom: 14px; }
    #claim-check { display: flex; justify-content: center; }
    #claim-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #a1c6a9;
      font-size: 0.85rem;
    }
    #claim-loading:not(:empty) { margin: 8px 0; }
    #claim-loading.is-loading::before {
      content: "";
      width: 18px;
      height: 18px;
      flex: none;
      border: 2px solid var(--green-dark);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: claim-spin 0.75s linear infinite;
    }
    @keyframes claim-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #claim-loading.is-loading::before { content: none; animation: none; }
    }
    .modal label { display: block; margin-bottom: 5px; }
    .modal input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      background: #050f05;
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      letter-spacing: 2px;
    }
    .modal input::placeholder { color: #1a5c1a; }
    .modal input:focus {
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    dialog.modal {
      position: fixed;
      inset: 0;
      margin: auto;
      width: min(var(--modal-width), calc(100% - 32px));
      max-width: none;
      max-height: calc(100% - 32px);
      padding: clamp(16px, 5vw, 26px);
      color: var(--green);
    }
    dialog.modal::backdrop { background: rgba(0,0,0,0.88); }
    #profile-modal { --modal-width: 420px; }
    #claim-modal { --modal-width: 380px; padding: 18px; }
    #reset-modal { --modal-width: 380px; }
    #reset-modal p { margin-bottom: 14px; }
    #profile-modal h2 { text-align: left; letter-spacing: 0; }
    .profile-field-label { display: flex; justify-content: space-between; gap: 8px; }
    #nickname-count, .profile-hint { color: #a1c6a9; font-size: 0.8rem; }
    .profile-hint { margin-bottom: 12px; }
    #profile-form fieldset { min-width: 0; border: 0; margin: 8px 0 12px; padding: 0; }
    .profile-colors { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .profile-swatch {
      width: 36px;
      height: 36px;
      background: var(--swatch);
      border: 2px solid #080e08;
      cursor: pointer;
    }
    .profile-swatch[aria-pressed="true"] { outline: 2px solid var(--green); outline-offset: 2px; }
    .profile-swatch:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    #profile-preview {
      padding: 10px;
      margin-bottom: 8px;
      background: #050f05;
      border: 1px solid var(--green-dim);
    }
    #profile-preview-seat { flex: none; pointer-events: none; }
    #profile-preview-name { min-width: 0; overflow-wrap: anywhere; }
    #profile-status { min-height: 1.3em; font-size: 0.85rem; }
    .admin-settings { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--green-dim); }
    .admin-settings h3 { margin-bottom: 8px; font-size: 1rem; }
    #admin-status, #admin-time { margin-bottom: 8px; color: #a1c6a9; font-size: 0.85rem; }
    #admin-status:empty, #admin-error:empty { display: none; }

    .modal-error {
      color: #ff0040;
      font-size: 0.8rem;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 6px rgba(255,0,64,0.6);
      letter-spacing: 1px;
    }
    #claim-error { min-height: 0; margin-bottom: 0; }
    #claim-error:not(:empty) { margin-block: 8px; }

    .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .modal-btns .btn { flex: 1; padding: 10px; font-size: 1.1rem; }
    .btn-cancel { --cancel-color: #8bd89c; border-color: var(--cancel-color); color: var(--cancel-color); }
    .btn-cancel:hover { background: var(--cancel-color); }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 900px) {
      .main { flex-direction: column; padding: 8px; }
      .leaderboard { width: 100%; position: static; max-height: 280px; }
      #grid { grid-template-columns: repeat(10, minmax(0, 28px)); }
    }
    @media (max-width: 600px) {
      .account-controls { flex-basis: 100%; }
    }
  </style>
</head>
<body>

<header>
  <h1>BOOKING 1000 SEATS COMPETITION</h1>
  <div class="header-controls">
    <div id="status-badge" class="status-badge inactive">Stopped</div>
    <button type="button" class="btn btn-start" data-admin-action="start" hidden><span>Start</span></button>
    <button type="button" class="btn btn-stop" data-admin-action="stop" hidden><span>Stop</span></button>
    <button type="button" class="btn btn-reset" data-admin-action="reset" hidden><span>Reset All</span></button>
    <div class="account-controls" id="account-controls">
      <button type="button" class="btn btn-start account-button" id="google-login" disabled><span id="login-label">로그인 확인 중…</span></button>
      <button type="button" class="btn btn-start account-button account-summary" id="account-toggle" aria-expanded="false" aria-controls="account-panel" hidden>
        <span class="lb-dot" id="account-color" aria-hidden="true" hidden></span>
        <span id="account-name"></span>
        <span aria-hidden="true">▾</span>
      </button>
      <div class="account-panel" id="account-panel" hidden>
        <button type="button" id="account-settings">계정 설정</button>
        <button type="button" id="logout">로그아웃</button>
      </div>
    </div>
  </div>
</header>

<div class="account-feedback">
  <p id="account-notice" role="status"></p>
  <button type="button" class="btn btn-start account-button" id="retry-profile" hidden><span>다시 불러오기</span></button>
</div>
<div class="main">
  <div class="grid-wrap">
    <div class="grid-info">
      Total 1000 &nbsp;|&nbsp; Claimed: <span id="claimed-count">0</span> &nbsp;|&nbsp; Remaining: <span id="remain-count">1000</span>
    </div>
    <div class="grid-scroll"><div id="grid"></div></div>
  </div>

  <div class="leaderboard">
    <div class="lb-header">LEADERBOARD</div>
    <div class="lb-stats">
      <span>Players</span>
      <span class="highlight" id="people-count">0</span>
    </div>
    <div id="leaderboard-email-error" hidden>
      <p id="leaderboard-email-error-message" role="status"></p>
      <button type="button" class="btn btn-start account-button" id="retry-leaderboard-emails"><span>이메일 다시 불러오기</span></button>
    </div>
    <div id="lb-list"></div>
  </div>
</div>

<div id="seat-tooltip" role="tooltip" hidden></div>

<dialog class="modal" id="profile-modal" aria-labelledby="profile-title">
  <form id="profile-form">
    <h2 id="profile-title">계정 설정</h2>
    <div class="profile-field-label">
      <label for="nickname">닉네임</label>
      <span id="nickname-count" aria-hidden="true">0 / 20</span>
    </div>
    <input type="text" id="nickname" maxlength="20" autocomplete="nickname" aria-describedby="nickname-hint" required autofocus>
    <p class="profile-hint" id="nickname-hint">1~20자 입력</p>
    <fieldset>
      <legend>좌석 색상</legend>
      <div class="profile-colors" id="profile-colors">
        <button type="button" class="profile-swatch" value="#00d2d3" style="--swatch: #00d2d3" aria-label="청록색" aria-pressed="false"></button>
        <button type="button" class="profile-swatch" value="#48e889" style="--swatch: #48e889" aria-label="초록색" aria-pressed="false"></button>
        <button type="button" class="profile-swatch" value="#ffda69" style="--swatch: #ffda69" aria-label="노란색" aria-pressed="false"></button>
        <button type="button" class="profile-swatch" value="#ff8880" style="--swatch: #ff8880" aria-label="산호색" aria-pressed="false"></button>
        <button type="button" class="profile-swatch" value="#88a9ff" style="--swatch: #88a9ff" aria-label="파란색" aria-pressed="false"></button>
        <button type="button" class="profile-swatch" value="#d29aff" style="--swatch: #d29aff" aria-label="보라색" aria-pressed="false"></button>
      </div>
      <label for="seat-color">직접 색상 선택</label>
      <input type="color" id="seat-color" value="#00d2d3">
    </fieldset>
    <div class="profile-preview" id="profile-preview">
      <span class="seat claimed" id="profile-preview-seat" aria-hidden="true"></span>
      <span id="profile-preview-name">닉네임 미리보기</span>
    </div>
    <p class="profile-hint">변경한 닉네임과 색상은 이후 신청하는 좌석에 적용됩니다.</p>
    <p id="profile-status" role="status"></p>
    <div class="modal-error" id="profile-error" role="alert"></div>
    <div class="modal-btns">
      <button type="submit" class="btn btn-start" id="save-profile"><span>저장</span></button>
      <button type="button" class="btn btn-cancel" id="cancel-profile"><span>취소</span></button>
    </div>
  </form>
  <section class="admin-settings" aria-labelledby="admin-title">
    <h3 id="admin-title">관리자 인증</h3>
    <form id="admin-form" method="dialog">
      <label for="admin-password">관리자 비밀번호</label>
      <input type="password" id="admin-password" autocomplete="current-password" required>
      <button type="submit" class="btn btn-start account-button" id="verify-admin"><span>인증하기</span></button>
    </form>
    <p id="admin-status" role="status"></p>
    <p id="admin-time" hidden></p>
    <p class="modal-error" id="admin-error" role="alert"></p>
    <button type="button" class="btn btn-cancel account-button" id="lock-admin" hidden><span>관리자 잠금</span></button>
  </section>
</dialog>

<dialog class="modal" id="claim-modal" aria-labelledby="claim-title">
  <form id="claim-form">
    <h2 id="claim-title">좌석 신청</h2>
    <div id="claim-check"></div>
    <p id="claim-loading" role="status"></p>
    <div class="modal-error" id="claim-error" role="alert"></div>
    <div class="modal-btns">
      <button type="submit" class="btn btn-start" id="submit-claim" disabled><span>신청</span></button>
      <button type="button" class="btn btn-cancel" id="cancel-claim" autofocus><span>취소</span></button>
    </div>
  </form>
</dialog>

<dialog class="modal" id="reset-modal" aria-labelledby="reset-title" aria-describedby="reset-description">
  <form method="dialog">
    <h2 id="reset-title">전체 좌석 초기화</h2>
    <p id="reset-description">게임을 중지하고 신청된 좌석을 모두 삭제합니다.</p>
    <div class="modal-btns">
      <button type="submit" class="btn btn-cancel" value="cancel" autofocus><span>취소</span></button>
      <button type="submit" class="btn btn-reset" value="reset"><span>초기화</span></button>
    </div>
  </form>
</dialog>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }                        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
  import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup,
           initializeAuth, inMemoryPersistence, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  // ============================================================
  // ⚠️ Firebase 설정 — 본인의 Firebase 프로젝트 콘솔에서
  //    "프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성"에서
  //    config 객체를 그대로 복사해 아래 값을 채워 넣으세요.
  //    (자세한 절차는 같이 첨부된 README.md 참고)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAUeQxLxbMrVCgQiNvlFlMYXaZfdgDSC1M",
    authDomain: "wonjongwoongbabu.firebaseapp.com",
    databaseURL: "https://wonjongwoongbabu-default-rtdb.firebaseio.com",
    projectId: "wonjongwoongbabu",
    storageBucket: "wonjongwoongbabu.firebasestorage.app",
    messagingSenderId: "290948556533",
    appId: "1:290948556533:web:be9f2b512881edfe00c7bc",
    measurementId: "G-7LJ10YVHER"
  };

  // ============================================================
  // 관리자 이메일 (Firebase Authentication에서 직접 생성한 계정)
  // ============================================================
  const ADMIN_EMAIL = "admin3@jongwoongbs.com";

  // ============================================================
  const app  = initializeApp(firebaseConfig);
  const db   = getDatabase(app);
  const auth = getAuth(app);
  const adminAuth = initializeAuth(initializeApp(firebaseConfig, "admin"), {
    persistence: inMemoryPersistence
  });

  const seatsRef  = ref(db, "seats");
  const activeRef = ref(db, "gameActive");

  // ---- 상태 ----
  let seats     = {};   // { "0": { name, color }, ... }
  let isActive  = false;
  let pendingSeat = null;  // 클릭한 좌석 번호
  let profile = null;
  let profileLoading = false;
  let profileLoadFailed = false;
  let savingProfile = false;
  let authReady = false;
  let accountUser = null;
  let signingIn = false;
  let signingOut = false;
  let seatAfterAccount = null;
  let claimInProgress = false;
  let claimToken = "";
  let claimWidget = null;
  let turnstileAssets = null;
  let lastClaimTime = 0;
  let adminSession = null;
  let adminVerification = null;
  let adminAction = null;
  const adminActionPendingMessage = "게임 상태를 변경하는 중…";
  const byId = (id) => document.getElementById(id);
  const adminButtons = document.querySelectorAll("[data-admin-action]");
  const resetDialog = byId("reset-modal");

  // ---- 그리드 초기 생성 ----
  const grid = document.getElementById("grid");
  for (let i = 0; i < 1000; i++) {
    const seat = document.createElement("div");
    seat.className = "seat inactive";
    seat.dataset.num = i + 1;
    seat.id = `seat-${i}`;
    seat.addEventListener("click", () => onSeatClick(i));
    grid.appendChild(seat);
  }

  // ---- 예약자 이름 말풍선 ----
  const seatTooltip = document.getElementById("seat-tooltip");
  let hoveredSeat = null;
  let tooltipX = 0;
  let tooltipY = 0;

  function hideSeatTooltip() {
    hoveredSeat = null;
    seatTooltip.hidden = true;
    seatTooltip.textContent = "";
  }

  function updateSeatTooltip() {
    if (!hoveredSeat || !hoveredSeat.classList.contains("claimed")) {
      seatTooltip.hidden = true;
      seatTooltip.textContent = "";
      return;
    }
    seatTooltip.textContent = hoveredSeat.dataset.owner;
    seatTooltip.hidden = false;
    const { width, height } = seatTooltip.getBoundingClientRect();
    const viewportWidth = document.documentElement.clientWidth;
    const viewportHeight = document.documentElement.clientHeight;
    let left = tooltipX + 12;
    let top = tooltipY + 14;
    if (left + width > viewportWidth - 8) left = tooltipX - width - 12;
    if (top + height > viewportHeight - 8) top = tooltipY - height - 14;
    seatTooltip.style.left = `${Math.max(8, Math.min(left, viewportWidth - width - 8))}px`;
    seatTooltip.style.top = `${Math.max(8, Math.min(top, viewportHeight - height - 8))}px`;
  }

  grid.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    const seat = e.target.closest(".seat");
    hoveredSeat = seat && grid.contains(seat) ? seat : null;
    tooltipX = e.clientX;
    tooltipY = e.clientY;
    updateSeatTooltip();
  });
  grid.addEventListener("pointerleave", hideSeatTooltip);
  grid.addEventListener("pointercancel", hideSeatTooltip);
  document.addEventListener("scroll", hideSeatTooltip, true);
  window.addEventListener("resize", hideSeatTooltip);
  window.addEventListener("blur", hideSeatTooltip);

  // ---- Firebase 실시간 감지 ----
  onValue(seatsRef, (snap) => {
    seats = snap.val() || {};
    refreshLeaderboardEmails();
    renderGrid();
    renderLeaderboard();
  });

  onValue(activeRef, (snap) => {
    isActive = snap.val() === true;
    updateStatus();
    renderGrid();
  });

  // ---- 렌더링 ----
  function renderGrid() {
    for (let i = 0; i < 1000; i++) {
      const el = document.getElementById(`seat-${i}`);
      if (!el) continue;
      const data = seats[i];
      if (data) {
        el.className = "seat claimed";
        el.style.background = data.color;
        el.dataset.owner = data.name;
      } else {
        el.style.background = "";
        el.dataset.owner = "";
        el.className = isActive ? "seat" : "seat inactive";
      }
    }
    updateSeatTooltip();
    const claimed = Object.keys(seats).length;
    document.getElementById("claimed-count").textContent = claimed;
    document.getElementById("remain-count").textContent  = 1000 - claimed;
  }

  function renderLeaderboard() {
    const session = currentAdminSession();
    const emailError = session?.emailError || "";
    byId("leaderboard-email-error-message").textContent = emailError;
    byId("leaderboard-email-error").hidden = !emailError;

    const players = new Map();
    for (const seat of Object.values(seats)) {
      if (!seat || typeof seat.name !== "string") continue;
      const uid = typeof seat.playerId === "string" ? seat.playerId : "";
      const key = uid ? `account:${uid}` : `legacy:${seat.name}`;
      const player = players.get(key) || { uid, count: 0, claimedAt: 0 };
      player.count++;
      const claimedAt = seat.claimedAt || 0;
      if (claimedAt >= player.claimedAt) {
        player.name = seat.name;
        player.color = seat.color;
        player.claimedAt = claimedAt;
      }
      players.set(key, player);
    }
    const sorted = [...players.values()].sort((a, b) => b.count - a.count);
    document.getElementById("people-count").textContent = sorted.length;

    const list = document.getElementById("lb-list");
    list.innerHTML = "";
    sorted.forEach(({ uid, name, color, count }, idx) => {
      const rank = idx + 1;
      const item = document.createElement("div");
      item.className = "lb-item";
      const rankClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
      item.innerHTML = `
        <div class="lb-rank ${rankClass}">${rank}</div>
        <div class="lb-dot"></div>
        <div class="lb-identity"><div class="lb-name"></div></div>
        <div class="lb-count">${count} seats</div>
      `;
      item.querySelector(".lb-dot").style.backgroundColor = color;
      item.querySelector(".lb-name").textContent = name;
      const email = session?.emails.get(uid);
      if (email) {
        const emailLine = document.createElement("div");
        emailLine.className = "lb-email";
        emailLine.textContent = email;
        item.querySelector(".lb-identity").appendChild(emailLine);
      }
      list.appendChild(item);
    });
  }

  function updateStatus() {
    const badge = document.getElementById("status-badge");
    if (isActive) {
      badge.textContent = "Active";
      badge.className = "status-badge active";
    } else {
      badge.textContent = "Stopped";
      badge.className = "status-badge inactive";
    }
  }

  async function accountRequest(user, path, method, body, { adminToken, signal } = {}) {
    const idToken = await user.getIdToken();
    const headers = { Authorization: `Bearer ${idToken}` };
    if (adminToken) headers["X-Admin-Token"] = adminToken;
    if (body) headers["Content-Type"] = "application/json";
    const res = await fetch(path, { method, headers, body: body && JSON.stringify(body), signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw Object.assign(new Error(data.error || "요청에 실패했습니다. 다시 시도하세요."), { status: res.status });
    }
    return data;
  }

  function setAccountPanel(open, restoreFocus = false) {
    byId("account-panel").hidden = !open;
    byId("account-toggle").setAttribute("aria-expanded", String(open));
    if (restoreFocus) byId("account-toggle").focus();
  }

  byId("account-toggle").addEventListener("click", () => setAccountPanel(byId("account-panel").hidden));
  document.addEventListener("click", (event) => {
    if (!byId("account-controls").contains(event.target)) setAccountPanel(false);
  });
  byId("account-controls").addEventListener("focusout", (event) => {
    if (event.relatedTarget && !byId("account-controls").contains(event.relatedTarget)) setAccountPanel(false);
  });

  function renderAccount() {
    byId("google-login").hidden = !!accountUser;
    byId("google-login").disabled = !authReady || signingIn;
    byId("login-label").textContent = !authReady ? "로그인 확인 중…"
      : signingIn ? "Google 로그인 중…" : "Google로 로그인";
    byId("account-toggle").hidden = !accountUser;
    byId("account-settings").disabled = profileLoading || signingOut;
    byId("logout").disabled = signingOut;
    byId("logout").textContent = signingOut ? "로그아웃 중…" : "로그아웃";
    byId("account-name").textContent = profileLoading ? "계정 불러오는 중…" : profile?.nickname || "내 계정";
    byId("account-color").hidden = !profile;
    byId("account-color").style.backgroundColor = profile?.color || "";
    byId("retry-profile").hidden = !profileLoadFailed;
  }

  onAuthStateChanged(auth, async (user) => {
    const previousUser = accountUser;
    if (!user || (previousUser && previousUser !== user)) seatAfterAccount = null;
    accountUser = user;
    authReady = true;
    if (user !== previousUser) lockAdmin();
    setAccountPanel(false);
    closeClaimModal();
    closeProfileModal();
    setProfileSaving(false);
    profile = null;
    profileLoading = false;
    profileLoadFailed = false;
    if (user) {
      await loadProfile(user);
    } else {
      byId("account-notice").textContent = previousUser ? "로그아웃했습니다." : "";
      renderAccount();
      if (previousUser) byId("google-login").focus();
    }
  });

  async function loadProfile(user) {
    if (profileLoading || auth.currentUser !== user) return;
    profileLoading = true;
    profileLoadFailed = false;
    byId("account-notice").textContent = "계정 설정을 불러오는 중입니다.";
    renderAccount();
    try {
      const data = await accountRequest(user, "/profile/sync", "POST");
      if (auth.currentUser !== user) return;
      profile = data.profile;
    } catch (error) {
      if (auth.currentUser !== user) return;
      profileLoadFailed = true;
      byId("account-notice").textContent = `계정 설정을 불러오지 못했습니다. ${error.message}`;
    } finally {
      if (auth.currentUser === user) {
        profileLoading = false;
        renderAccount();
      }
    }
    if (profileLoadFailed) {
      byId("retry-profile").focus();
      return;
    }
    byId("account-notice").textContent = "";
    if (!profile) {
      openProfileModal();
    } else {
      if (seatAfterAccount === null && document.activeElement === document.body) byId("account-toggle").focus();
      resumeSeatAfterAccount();
    }
  }

  byId("retry-profile").addEventListener("click", () => {
    if (accountUser) loadProfile(accountUser);
  });

  byId("google-login").addEventListener("click", async () => {
    signingIn = true;
    byId("account-notice").textContent = "Google 로그인 창에서 계정을 선택해 주세요.";
    renderAccount();
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (error) {
      const messages = {
        "auth/popup-blocked": "팝업 차단을 해제한 뒤 다시 로그인하세요.",
        "auth/popup-closed-by-user": "Google 로그인 창을 닫았습니다. 다시 로그인할 수 있습니다.",
        "auth/unauthorized-domain": "이 주소에서 Google 로그인을 사용할 수 없습니다.",
        "auth/operation-not-allowed": "현재 Google 로그인을 사용할 수 없습니다."
      };
      if (error.code === "auth/popup-closed-by-user") seatAfterAccount = null;
      byId("account-notice").textContent = messages[error.code] || "Google 로그인에 실패했습니다. 다시 시도하세요.";
    } finally {
      signingIn = false;
      renderAccount();
      if (!accountUser) byId("google-login").focus();
    }
  });

  byId("logout").addEventListener("click", async () => {
    signingOut = true;
    lockAdmin();
    renderAccount();
    try {
      await signOut(auth);
    } catch {
      byId("account-notice").textContent = "로그아웃하지 못했습니다. 다시 시도하세요.";
    } finally {
      signingOut = false;
      renderAccount();
      if (accountUser && !byId("account-panel").hidden) byId("logout").focus();
    }
  });

  function updateProfilePreview() {
    const nickname = byId("nickname").value;
    const color = byId("seat-color").value;
    byId("nickname-count").textContent = `${nickname.length} / ${byId("nickname").maxLength}`;
    byId("profile-preview-name").textContent = nickname.trim() || "닉네임 미리보기";
    byId("profile-preview-seat").style.backgroundColor = color;
    byId("profile-colors").querySelectorAll("button").forEach((swatch) => {
      swatch.setAttribute("aria-pressed", String(swatch.value === color));
    });
  }

  byId("nickname").addEventListener("input", () => {
    byId("nickname").removeAttribute("aria-invalid");
    byId("profile-error").textContent = "";
    updateProfilePreview();
  });
  byId("seat-color").addEventListener("input", updateProfilePreview);
  byId("profile-colors").addEventListener("click", (event) => {
    const swatch = event.target.closest(".profile-swatch");
    if (!swatch) return;
    byId("seat-color").value = swatch.value;
    updateProfilePreview();
  });

  function openProfileModal() {
    if (savingProfile || byId("profile-modal").open) return;
    setAccountPanel(false, true);
    byId("profile-title").textContent = profile ? "계정 설정" : "닉네임과 좌석 색상 설정";
    byId("nickname").value = profile?.nickname || "";
    byId("nickname").removeAttribute("aria-invalid");
    byId("seat-color").value = profile?.color || "#00d2d3";
    byId("profile-error").textContent = profileLoadFailed ? "계정 설정을 다시 불러온 뒤 닉네임과 색상을 변경해 주세요." : "";
    setProfileSaving(false);
    renderAdminControls();
    updateProfilePreview();
    byId("profile-modal").showModal();
  }

  function closeProfileModal() {
    if (adminVerification) adminVerification.cancelled = true;
    byId("admin-password").value = "";
    byId("admin-error").textContent = "";
    byId("profile-modal").close();
  }

  function cancelProfileModal() {
    if (savingProfile) return;
    seatAfterAccount = null;
    closeProfileModal();
    if (!profile) byId("account-notice").textContent = "좌석을 신청하려면 계정 설정을 완료해 주세요.";
  }

  function setProfileSaving(saving) {
    savingProfile = saving;
    byId("nickname").readOnly = saving || profileLoadFailed;
    byId("profile-form").querySelector("fieldset").disabled = saving || profileLoadFailed;
    byId("save-profile").disabled = saving || profileLoadFailed;
    byId("cancel-profile").disabled = saving;
    byId("profile-status").textContent = saving ? "계정 설정을 저장하는 중입니다." : "";
  }

  byId("account-settings").addEventListener("click", openProfileModal);
  byId("cancel-profile").addEventListener("click", cancelProfileModal);
  byId("profile-modal").addEventListener("cancel", (event) => {
    event.preventDefault();
    cancelProfileModal();
  });
  byId("profile-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const user = auth.currentUser;
    if (!user || savingProfile || profileLoadFailed) return;
    const nickname = byId("nickname").value.trim();
    const color = byId("seat-color").value;
    if (!nickname) {
      byId("profile-error").textContent = "닉네임을 입력하세요.";
      byId("nickname").setAttribute("aria-invalid", "true");
      byId("nickname").focus();
      return;
    }
    setProfileSaving(true);
    byId("profile-error").textContent = "";
    try {
      const data = await accountRequest(user, "/profile", "PUT", { nickname, color });
      if (auth.currentUser !== user) return;
      profile = data.profile;
      renderAccount();
      closeProfileModal();
      byId("account-notice").textContent = "계정 설정을 저장했습니다.";
      resumeSeatAfterAccount();
    } catch (error) {
      if (auth.currentUser === user) byId("profile-error").textContent = error.message;
    } finally {
      if (auth.currentUser === user) setProfileSaving(false);
    }
  });

  function loadTurnstile() {
    if (!turnstileAssets) {
      turnstileAssets = (async () => {
        const res = await fetch("/config");
        const config = await res.json();
        if (!res.ok || !config.turnstileSiteKey) throw new Error("사람 확인이 아직 설정되지 않았습니다.");
        if (!window.turnstile) {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error("사람 확인을 불러오지 못했습니다. 신청 창을 다시 여세요."));
            };
            document.head.appendChild(script);
          });
        }
        return config.turnstileSiteKey;
      })().catch((error) => {
        turnstileAssets = null;
        throw error;
      });
    }
    return turnstileAssets;
  }

  function resumeSeatAfterAccount() {
    const idx = seatAfterAccount;
    seatAfterAccount = null;
    if (idx === null) return;
    if (!isActive || seats[idx]) {
      byId("account-notice").textContent = isActive
        ? `${idx + 1}번 좌석은 이미 신청됐습니다. 다른 좌석을 선택해 주세요.`
        : "예약이 중지됐습니다. 예약이 시작되면 좌석을 선택해 주세요.";
      return;
    }
    onSeatClick(idx);
  }

  async function onSeatClick(idx) {
    if (!isActive || seats[idx] || pendingSeat !== null || claimInProgress) return;
    if (!authReady) {
      byId("account-notice").textContent = "로그인 상태를 확인하는 중입니다.";
      return;
    }
    const user = auth.currentUser;
    if (!user) {
      seatAfterAccount = idx;
      byId("account-notice").textContent = `${idx + 1}번 좌석을 신청하려면 Google로 로그인하세요.`;
      byId("google-login").focus();
      return;
    }
    if (profileLoading) {
      seatAfterAccount = idx;
      byId("account-notice").textContent = "계정 설정을 불러오는 중입니다.";
      return;
    }
    if (profileLoadFailed) {
      seatAfterAccount = idx;
      byId("retry-profile").focus();
      return;
    }
    if (!profile) {
      seatAfterAccount = idx;
      openProfileModal();
      return;
    }
    setAccountPanel(false);
    const selection = { seatId: idx, user };
    pendingSeat = selection;
    byId("claim-title").textContent = `${idx + 1}번 좌석 신청`;
    byId("claim-error").textContent = "";
    setClaimToken("", "사람 확인 중…", true);
    byId("claim-modal").showModal();

    const updateVerification = (token, message, loading) => {
      if (pendingSeat === selection && !claimInProgress) setClaimToken(token, message, loading);
    };

    try {
      const sitekey = await loadTurnstile();
      if (pendingSeat !== selection) return;
      claimWidget = window.turnstile.render("#claim-check", {
        sitekey,
        action: "seat_claim",
        appearance: "interaction-only",
        size: byId("claim-check").clientWidth < 300 ? "compact" : "normal",
        callback: (token) => updateVerification(token),
        "before-interactive-callback": () => updateVerification("", "사람 확인을 완료해 주세요."),
        "after-interactive-callback": () => {
          if (!claimToken) updateVerification("", "사람 확인 중…", true);
        },
        "expired-callback": () => updateVerification("", "사람 확인 중…", true),
        "timeout-callback": () => updateVerification("", "사람 확인 중…", true),
        "unsupported-callback": () => updateVerification("", "이 브라우저에서는 사람 확인을 사용할 수 없습니다."),
        "error-callback": () => {
          updateVerification("", "사람 확인에 실패했습니다. 문제가 계속되면 신청 창을 다시 열어 주세요.");
          return true;
        }
      });
    } catch (error) {
      if (pendingSeat === selection) {
        setClaimToken("");
        byId("claim-error").textContent = error.message || "사람 확인을 불러오지 못했습니다.";
      }
    }
  }

  function setClaimToken(token, message = "", loading = false) {
    claimToken = token;
    const status = byId("claim-loading");
    if (status.textContent !== message) status.textContent = message;
    status.classList.toggle("is-loading", loading);
    byId("submit-claim").disabled = claimInProgress || !token;
  }

  function closeClaimModal() {
    pendingSeat = null;
    if (claimWidget !== null) window.turnstile.remove(claimWidget);
    claimWidget = null;
    setClaimToken("");
    byId("claim-modal").close();
  }

  byId("cancel-claim").addEventListener("click", closeClaimModal);
  byId("claim-modal").addEventListener("cancel", (event) => {
    event.preventDefault();
    if (!claimInProgress) closeClaimModal();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !byId("account-panel").hidden) {
      event.preventDefault();
      setAccountPanel(false, true);
    }
  });

  byId("claim-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const selection = pendingSeat;
    if (!selection || !claimToken || claimInProgress) return;
    const { seatId, user } = selection;
    if (!isActive || seats[seatId]) {
      byId("claim-error").textContent = isActive ? "이미 신청된 좌석입니다." : "게임이 진행 중일 때 신청할 수 있습니다.";
      return;
    }
    if (Date.now() - lastClaimTime < 1000) {
      byId("claim-error").textContent = "잠시 후 다시 신청하세요.";
      return;
    }
    lastClaimTime = Date.now();
    const turnstileToken = claimToken;
    claimInProgress = true;
    setClaimToken("", "좌석을 신청하는 중…", true);
    byId("cancel-claim").disabled = true;
    byId("claim-error").textContent = "";
    try {
      await accountRequest(user, "/claim", "POST", { seatId, turnstileToken });
      if (pendingSeat !== selection) return;
      closeClaimModal();
      byId("account-notice").textContent = `${seatId + 1}번 좌석을 신청했습니다.`;
    } catch (error) {
      if (pendingSeat !== selection) return;
      byId("claim-error").textContent = error.message;
    } finally {
      claimInProgress = false;
      byId("cancel-claim").disabled = false;
    }
    if (pendingSeat === selection) {
      setClaimToken("", "사람 확인 중…", true);
      if (claimWidget !== null) window.turnstile.reset(claimWidget);
    }
  });

  function remainingAdminTime(session) {
    return Math.min(session.deadline - performance.now(), session.wallDeadline - Date.now());
  }

  function currentAdminSession() {
    if (!adminSession || signingOut || adminSession.user !== auth.currentUser || remainingAdminTime(adminSession) <= 0) return null;
    return adminSession;
  }

  function renderAdminControls() {
    const session = currentAdminSession();
    for (const button of adminButtons) {
      button.hidden = !session;
      button.disabled = !!adminAction;
    }
    byId("admin-form").hidden = !!session;
    byId("admin-password").disabled = !!adminVerification;
    byId("verify-admin").disabled = !!adminVerification;
    byId("lock-admin").hidden = !session;
    byId("admin-time").hidden = !session;
    byId("admin-status").textContent = session ? "관리자 인증 완료" : adminVerification ? "관리자 인증 중…" : "";
  }

  function updateAdminClock() {
    if (!adminSession) return;
    const session = currentAdminSession();
    if (!session) {
      lockAdmin("관리자 인증이 만료되었습니다. 다시 인증해 주세요.");
      return;
    }
    const seconds = Math.ceil(remainingAdminTime(session) / 1000);
    byId("admin-time").textContent = `남은 시간 ${Math.floor(seconds / 60)}분 ${seconds % 60}초`;
  }

  function lockAdmin(message = "") {
    if (adminVerification) adminVerification.cancelled = true;
    const session = adminSession;
    adminSession = null;
    if (session) {
      clearInterval(session.clock);
      clearInterval(session.emailClock);
      cancelLeaderboardEmailRequest(session);
      session.emails.clear();
      renderLeaderboard();
    }
    if (resetDialog.open) resetDialog.close();
    if (adminAction && byId("account-notice").textContent === adminActionPendingMessage) {
      byId("account-notice").textContent = message;
    }
    byId("admin-password").value = "";
    byId("admin-time").textContent = "";
    byId("admin-error").textContent = message;
    renderAdminControls();
  }

  byId("lock-admin").addEventListener("click", () => {
    lockAdmin();
    byId("admin-password").focus();
  });
  window.addEventListener("pagehide", () => lockAdmin());
  document.addEventListener("visibilitychange", updateAdminClock);

  byId("admin-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const user = auth.currentUser;
    if (!user || signingOut || adminVerification || currentAdminSession() || !byId("profile-modal").open) return;

    const password = byId("admin-password").value;
    byId("admin-password").value = "";
    byId("admin-error").textContent = "";
    const verification = { cancelled: false };
    adminVerification = verification;
    renderAdminControls();
    try {
      let token;
      try {
        const credential = await signInWithEmailAndPassword(adminAuth, ADMIN_EMAIL, password);
        token = await credential.user.getIdToken();
      } finally {
        if (adminAuth.currentUser) await signOut(adminAuth);
      }
      if (verification.cancelled || auth.currentUser !== user) return;

      const startedAt = performance.now();
      const wallStartedAt = Date.now();
      const { expiresAt, serverTime } = await accountRequest(user, "/admin/verify", "POST", undefined, { adminToken: token });
      if (verification.cancelled || auth.currentUser !== user) return;

      const lifetime = expiresAt - serverTime;
      if (!Number.isFinite(lifetime) || lifetime <= performance.now() - startedAt || lifetime > 600_000) {
        throw new Error("관리자 인증 시간을 확인하지 못했습니다. 다시 인증해 주세요.");
      }
      adminSession = {
        user, token, deadline: startedAt + lifetime, wallDeadline: wallStartedAt + lifetime,
        clock: setInterval(updateAdminClock, 1000),
        emailClock: setInterval(() => { if (!document.hidden) refreshLeaderboardEmails(true); }, 20_000),
        emails: new Map(), rosterKey: null, emailError: "", emailTimer: null, emailRequest: null
      };
      updateAdminClock();
      refreshLeaderboardEmails();
      renderLeaderboard();
    } catch (error) {
      if (!verification.cancelled && auth.currentUser === user) {
        byId("admin-error").textContent = error.code?.startsWith("auth/")
          ? "관리자 비밀번호를 확인한 뒤 다시 시도해 주세요."
          : error.message;
      }
    } finally {
      adminVerification = null;
      renderAdminControls();
      if (!verification.cancelled && byId("profile-modal").open) {
        byId(currentAdminSession() ? "lock-admin" : "admin-password").focus();
      }
    }
  });

  function cancelLeaderboardEmailRequest(session) {
    clearTimeout(session.emailTimer);
    session.emailTimer = null;
    session.emailRequest?.abort();
    session.emailRequest = null;
  }

  function refreshLeaderboardEmails(refreshSameRoster = false) {
    const session = currentAdminSession();
    if (!session || adminAction === "reset") return;
    const roster = new Set();
    for (const seat of Object.values(seats)) {
      if (typeof seat?.name === "string" && typeof seat.playerId === "string" && seat.playerId) roster.add(seat.playerId);
    }
    const rosterKey = JSON.stringify([...roster].sort());
    const sameRoster = session.rosterKey === rosterKey;
    if (sameRoster && (!refreshSameRoster || session.emailRequest || session.emailTimer !== null)) return;

    session.rosterKey = rosterKey;
    if (!sameRoster) session.emailError = "";
    cancelLeaderboardEmailRequest(session);
    for (const uid of session.emails.keys()) {
      if (!roster.has(uid)) session.emails.delete(uid);
    }
    if (roster.size) session.emailTimer = setTimeout(() => loadLeaderboardEmails(session, roster), 250);
  }

  async function loadLeaderboardEmails(session, roster) {
    session.emailTimer = null;
    if (currentAdminSession() !== session) return;
    const request = new AbortController();
    session.emailRequest = request;
    try {
      const { emails } = await accountRequest(session.user, "/admin/leaderboard-emails", "GET", undefined, {
        adminToken: session.token, signal: request.signal
      });
      if (currentAdminSession() !== session || session.emailRequest !== request) return;
      session.emails = new Map(emails.filter(({ uid }) => roster.has(uid)).map(({ uid, email }) => [uid, email]));
      session.emailError = "";
    } catch (error) {
      if (currentAdminSession() !== session || session.emailRequest !== request) return;
      if (error.status === 403) {
        lockAdmin("관리자 인증이 만료되었습니다. 다시 인증해 주세요.");
        return;
      }
      session.emailError = error.message || "참가자 이메일을 불러오지 못했습니다.";
    } finally {
      if (session.emailRequest === request) {
        session.emailRequest = null;
        renderLeaderboard();
      }
    }
  }

  byId("retry-leaderboard-emails").addEventListener("click", () => {
    const session = currentAdminSession();
    if (!session) return;
    session.rosterKey = null;
    refreshLeaderboardEmails();
    renderLeaderboard();
  });

  for (const button of adminButtons) {
    button.addEventListener("click", () => {
      if (!currentAdminSession() || adminAction) return;
      const action = button.dataset.adminAction;
      if (action === "reset") {
        resetDialog.showModal();
      } else {
        runAdminAction(action);
      }
    });
  }

  resetDialog.querySelector("form").addEventListener("submit", (event) => {
    if (event.submitter?.value !== "reset") return;
    event.preventDefault();
    resetDialog.close();
    runAdminAction("reset");
  });

  async function runAdminAction(action) {
    const session = currentAdminSession();
    if (!session || adminAction) return;
    adminAction = action;
    if (action === "reset") {
      cancelLeaderboardEmailRequest(session);
      session.rosterKey = null;
      session.emails.clear();
      session.emailError = "";
      renderLeaderboard();
    }
    renderAdminControls();
    byId("account-notice").textContent = adminActionPendingMessage;
    try {
      await accountRequest(session.user, `/${action}`, "POST", undefined, { adminToken: session.token });
      if (currentAdminSession() !== session) return;
      const messages = { start: "게임을 시작했습니다.", stop: "게임을 중지했습니다.", reset: "좌석을 모두 초기화했습니다." };
      byId("account-notice").textContent = messages[action];
    } catch (error) {
      if (currentAdminSession() !== session) return;
      if (error.status === 403) lockAdmin("관리자 인증이 만료되었습니다. 다시 인증해 주세요.");
      byId("account-notice").textContent = error.message;
    } finally {
      adminAction = null;
      renderAdminControls();
      if (action === "reset") refreshLeaderboardEmails();
    }
  }
</script>

</body>
</html>
