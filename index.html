<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOOKING 1000 SEATS COMPETITION</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    :root {
      --green:      #00ff41;
      --green-dim:  #00b32d;
      --green-dark: #003b00;
      --green-glow: rgba(0,255,65,0.4);
      --bg:         #000000;
      --bg2:        #0a0a0a;
      --bg3:        #0d1a0d;
    }

    body {
      background: var(--bg);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    header, .main { position: relative; z-index: 1; }

    header {
      background: rgba(0,0,0,0.92);
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 -1px 0 var(--green);
    }

    header h1 {
      font-family: 'VT323', monospace;
      font-size: 2rem;
      color: var(--green);
      letter-spacing: 4px;
      text-shadow: 0 0 10px var(--green), 0 0 30px var(--green-glow);
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    [hidden] { display: none !important; }
    .account-button { width: auto; padding: 0 12px; letter-spacing: 0; text-transform: none; }
    .account-summary, .profile-preview { display: flex; align-items: center; gap: 8px; }
    .account-summary { font-size: 0.9rem; }
    #account-notice { padding: 0 16px; margin-top: 12px; }
    #account-notice:empty { display: none; }

    /* 상태 뱃지 + 버튼 공통 크기 */
    .status-badge,
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 40px;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid currentColor;
    }

    .status-badge {
      pointer-events: none;
    }
    .status-badge.active {
      color: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow), inset 0 0 10px rgba(0,255,65,0.1);
      text-shadow: 0 0 8px var(--green);
      animation: blink-badge 1.5s infinite;
    }
    .status-badge.inactive {
      color: #1a4d1a;
      border-color: #1a4d1a;
    }
    @keyframes blink-badge {
      0%,100% { opacity: 1; }
      50%      { opacity: 0.6; }
    }

    .btn {
      background: transparent;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .btn:hover::before { opacity: 1; }
    .btn:hover { color: #000; text-shadow: none; }
    .btn span { position: relative; z-index: 1; }
    .btn:disabled { opacity: 0.55; cursor: default; pointer-events: none; }

    .btn-start { color: var(--green); border-color: var(--green); }
    .btn-start::before { background: var(--green); }
    .btn-start:hover { box-shadow: 0 0 15px var(--green-glow); }

    .btn-stop { color: #aaff00; border-color: #aaff00; }
    .btn-stop::before { background: #aaff00; }
    .btn-stop:hover { box-shadow: 0 0 15px rgba(170,255,0,0.5); }

    .btn-reset { color: #ff0040; border-color: #ff0040; }
    .btn-reset::before { background: #ff0040; }
    .btn-reset:hover { box-shadow: 0 0 15px rgba(255,0,64,0.5); }

    .main {
      display: flex;
      gap: 16px;
      padding: 16px;
      align-items: flex-start;
    }

    .grid-wrap { flex: 1; }

    .grid-info {
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--green-dim);
      letter-spacing: 1px;
    }
    .grid-info span { color: var(--green); text-shadow: 0 0 6px var(--green); }

    .grid-scroll {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      padding-right: 4px;
    }
    .grid-scroll::-webkit-scrollbar { width: 4px; }
    .grid-scroll::-webkit-scrollbar-track { background: #000; }
    .grid-scroll::-webkit-scrollbar-thumb { background: var(--green-dim); border-radius: 2px; }

    #grid {
      display: grid;
      grid-template-columns: repeat(25, 28px);
      gap: 3px;
    }

    .seat {
      width: 28px;
      height: 28px;
      background: #0a1a0a;
      border: 1px solid #00cc33;
      cursor: pointer;
      transition: all 0.1s;
      position: relative;
    }
    .seat:hover:not(.claimed):not(.inactive) {
      background: #00ff41;
      border-color: #00ff41;
      box-shadow: 0 0 8px #00ff41;
      z-index: 2;
      transform: scale(1.35);
    }
    .seat.claimed {
      cursor: default;
      border-color: transparent;
    }
    .seat.claimed:hover {
      transform: scale(1.35);
      z-index: 2;
      box-shadow: 0 0 8px rgba(255,255,255,0.4);
    }
    .seat.inactive {
      cursor: not-allowed;
      opacity: 0.4;
    }
    .seat.inactive:hover { transform: none; box-shadow: none; }

    /* Leaderboard */
    .leaderboard {
      width: 210px;
      min-width: 190px;
      background: rgba(0,0,0,0.9);
      border: 1px solid var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 0 20px rgba(0,255,65,0.03);
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 90px);
      display: flex;
      flex-direction: column;
    }

    .lb-header {
      background: var(--green-dark);
      padding: 12px;
      text-align: center;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      color: var(--green);
      letter-spacing: 4px;
      border-bottom: 1px solid var(--green);
      text-shadow: 0 0 10px var(--green);
    }

    .lb-stats {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--green-dim);
      border-bottom: 1px solid #0a2a0a;
      letter-spacing: 1px;
    }
    .lb-stats .highlight { color: var(--green); text-shadow: 0 0 6px var(--green); }

    #lb-list { overflow-y: auto; flex: 1; padding: 4px 0; }
    #lb-list::-webkit-scrollbar { width: 3px; }
    #lb-list::-webkit-scrollbar-track { background: #000; }
    #lb-list::-webkit-scrollbar-thumb { background: var(--green-dim); }

    .lb-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid #0a1a0a;
      transition: background 0.1s;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
    }
    .lb-item:hover { background: rgba(0,255,65,0.05); }

    .lb-rank {
      font-family: 'VT323', monospace;
      font-size: 1rem;
      color: #1a5c1a;
      width: 18px;
      text-align: center;
      flex-shrink: 0;
    }
    .lb-rank.gold   { color: #ffd700; text-shadow: 0 0 6px rgba(255,215,0,0.6); }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }

    .lb-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 4px currentColor;
    }

    .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--green); }
    .lb-count { font-family: 'VT323', monospace; font-size: 1rem; color: var(--green); flex-shrink: 0; text-shadow: 0 0 6px var(--green); }

    /* Modals */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }

    .modal {
      background: #000;
      border: 1px solid var(--green);
      padding: 30px;
      width: 340px;
      max-width: 90vw;
      box-shadow: 0 0 40px var(--green-glow), inset 0 0 40px rgba(0,255,65,0.03);
      animation: popIn 0.15s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.9) translateY(-10px); opacity: 0; }
      to   { transform: scale(1) translateY(0);       opacity: 1; }
    }

    .modal h2 {
      margin-bottom: 18px;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      color: var(--green);
      text-align: center;
      letter-spacing: 3px;
      text-shadow: 0 0 10px var(--green);
    }
    #claim-modal .modal { width: 380px; padding-inline: 18px; }
    #claim-check { display: flex; justify-content: center; margin: 12px 0; }
    #claim-status { min-height: 1.25em; font-size: 0.9rem; }
    .modal label { display: block; margin-bottom: 5px; }
    .modal input[type="color"] { height: 42px; padding: 4px; cursor: pointer; }

    .modal input {
      width: 100%;
      padding: 10px 14px;
      background: #050f05;
      border: 1px solid var(--green-dim);
      color: var(--green);
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      letter-spacing: 2px;
    }
    .modal input::placeholder { color: #1a5c1a; }
    .modal input:focus {
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    .modal-error {
      color: #ff0040;
      font-size: 0.8rem;
      min-height: 18px;
      margin-bottom: 10px;
      text-align: center;
      text-shadow: 0 0 6px rgba(255,0,64,0.6);
      letter-spacing: 1px;
    }

    .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
    .modal-btns .btn { flex: 1; padding: 10px; font-size: 1.1rem; }
    .btn-confirm { border-color: var(--green); color: var(--green); }
    .btn-cancel  { border-color: #1a5c1a; color: #1a5c1a; }
    .btn-cancel:hover { color: #000; border-color: #1a5c1a; box-shadow: none; }
    .btn-cancel:hover::before { background: #1a5c1a; opacity: 1; }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 900px) {
      .main { flex-direction: column; padding: 8px; }
      .leaderboard { width: 100%; position: static; max-height: 280px; }
      #grid { grid-template-columns: repeat(10, 28px); }
    }
  </style>
</head>
<body>

<header>
  <h1>BOOKING 1000 SEATS COMPETITION</h1>
  <div class="header-controls">
    <div id="status-badge" class="status-badge inactive">Stopped</div>
    <div class="account-summary" id="account-summary" hidden>
      <span class="lb-dot" id="account-color" hidden></span>
      <span id="account-name"></span>
    </div>
    <button class="btn btn-start account-button" id="google-login" disabled><span>Google 로그인</span></button>
    <button class="btn btn-start account-button" id="account-settings" hidden><span>계정 설정</span></button>
    <button class="btn btn-stop account-button" id="logout" hidden><span>로그아웃</span></button>
    <button class="btn btn-start" onclick="askPassword('start')"><span>Start</span></button>
    <button class="btn btn-stop"  onclick="askPassword('stop')"><span>Stop</span></button>
    <button class="btn btn-reset" onclick="askPassword('reset')"><span>Reset All</span></button>
  </div>
</header>

<p id="account-notice" role="status"></p>
<div class="main">
  <div class="grid-wrap">
    <div class="grid-info">
      Total 1000 &nbsp;|&nbsp; Claimed: <span id="claimed-count">0</span> &nbsp;|&nbsp; Remaining: <span id="remain-count">1000</span>
    </div>
    <div class="grid-scroll"><div id="grid"></div></div>
  </div>

  <div class="leaderboard">
    <div class="lb-header">LEADERBOARD</div>
    <div class="lb-stats">
      <span>Players</span>
      <span class="highlight" id="people-count">0</span>
    </div>
    <div id="lb-list"></div>
  </div>
</div>

<div class="modal-overlay" id="profile-modal">
  <form class="modal" id="profile-form" role="dialog" aria-modal="true" aria-labelledby="profile-title">
    <h2 id="profile-title">계정 설정</h2>
    <label for="nickname">닉네임</label>
    <input type="text" id="nickname" maxlength="20" autocomplete="nickname" required>
    <label for="seat-color">좌석 색상</label>
    <input type="color" id="seat-color" value="#00d2d3">
    <div class="modal-error" id="profile-error" role="status"></div>
    <div class="modal-btns">
      <button type="submit" class="btn btn-start" id="save-profile"><span>저장</span></button>
      <button type="button" class="btn btn-cancel" id="cancel-profile"><span>취소</span></button>
    </div>
  </form>
</div>

<div class="modal-overlay" id="claim-modal">
  <form class="modal" id="claim-form" role="dialog" aria-modal="true" aria-labelledby="claim-title">
    <h2 id="claim-title">좌석 신청</h2>
    <p class="profile-preview"><span class="lb-dot" id="claim-color"></span><span id="claim-name"></span></p>
    <div id="claim-check"></div>
    <p id="claim-status" role="status"></p>
    <div class="modal-error" id="claim-error" role="alert"></div>
    <div class="modal-btns">
      <button type="submit" class="btn btn-start" id="submit-claim" disabled><span>신청</span></button>
      <button type="button" class="btn btn-cancel" id="cancel-claim"><span>취소</span></button>
    </div>
  </form>
</div>

<!-- 비밀번호 모달 -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal">
    <h2 id="pw-modal-title">Admin Authentication</h2>
    <input type="password" id="pw-input" placeholder="Password" autocomplete="off">
    <div class="modal-error" id="pw-error"></div>
    <div class="modal-btns">
      <button class="btn btn-confirm" onclick="confirmPassword()">Confirm</button>
      <button class="btn btn-cancel"  onclick="closePwModal()">Cancel</button>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp }                        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getDatabase, ref, onValue }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";
  import { getAuth, GoogleAuthProvider, onAuthStateChanged, signInWithPopup,
           initializeAuth, inMemoryPersistence, signInWithEmailAndPassword, signOut }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

  // ============================================================
  // ⚠️ Firebase 설정 — 본인의 Firebase 프로젝트 콘솔에서
  //    "프로젝트 설정 > 일반 > 내 앱 > SDK 설정 및 구성"에서
  //    config 객체를 그대로 복사해 아래 값을 채워 넣으세요.
  //    (자세한 절차는 같이 첨부된 README.md 참고)
  // ============================================================
  const firebaseConfig = {
    apiKey: "AIzaSyAUeQxLxbMrVCgQiNvlFlMYXaZfdgDSC1M",
    authDomain: "wonjongwoongbabu.firebaseapp.com",
    databaseURL: "https://wonjongwoongbabu-default-rtdb.firebaseio.com",
    projectId: "wonjongwoongbabu",
    storageBucket: "wonjongwoongbabu.firebasestorage.app",
    messagingSenderId: "290948556533",
    appId: "1:290948556533:web:be9f2b512881edfe00c7bc",
    measurementId: "G-7LJ10YVHER"
  };

  // ============================================================
  // 관리자 이메일 (Firebase Authentication에서 직접 생성한 계정)
  // ============================================================
  const ADMIN_EMAIL = "admin3@jongwoongbs.com";

  // ============================================================
  const app  = initializeApp(firebaseConfig);
  const db   = getDatabase(app);
  const auth = getAuth(app);
  const adminAuth = initializeAuth(initializeApp(firebaseConfig, "admin"), {
    persistence: inMemoryPersistence
  });

  const seatsRef  = ref(db, "seats");
  const activeRef = ref(db, "gameActive");

  // ---- 상태 ----
  let seats     = {};   // { "0": { name, color }, ... }
  let isActive  = false;
  let pendingSeat = null;  // 클릭한 좌석 번호
  let pendingAction = null; // 'start' | 'stop' | 'reset'
  let profile = null;
  let profileLoading = false;
  let savingProfile = false;
  let claimInProgress = false;
  let claimToken = "";
  let claimWidget = null;
  let turnstileAssets = null;
  let lastClaimTime = 0;
  let adminInProgress = false;
  const byId = (id) => document.getElementById(id);

  // ---- 그리드 초기 생성 ----
  const grid = document.getElementById("grid");
  for (let i = 0; i < 1000; i++) {
    const seat = document.createElement("div");
    seat.className = "seat inactive";
    seat.dataset.num = i + 1;
    seat.id = `seat-${i}`;
    seat.addEventListener("click", () => onSeatClick(i));
    grid.appendChild(seat);
  }

  // ---- Firebase 실시간 감지 ----
  onValue(seatsRef, (snap) => {
    seats = snap.val() || {};
    renderGrid();
    renderLeaderboard();
  });

  onValue(activeRef, (snap) => {
    isActive = snap.val() === true;
    updateStatus();
    renderGrid();
  });

  // ---- 렌더링 ----
  function renderGrid() {
    for (let i = 0; i < 1000; i++) {
      const el = document.getElementById(`seat-${i}`);
      if (!el) continue;
      const data = seats[i];
      if (data) {
        el.className = "seat claimed";
        el.style.background = data.color;
        el.dataset.owner = data.name;
        el.title = data.name;
      } else {
        el.style.background = "";
        el.dataset.owner = "";
        el.title = "";
        el.className = isActive ? "seat" : "seat inactive";
      }
    }
    const claimed = Object.keys(seats).length;
    document.getElementById("claimed-count").textContent = claimed;
    document.getElementById("remain-count").textContent  = 1000 - claimed;
  }

  function renderLeaderboard() {
    const players = new Map();
    for (const seat of Object.values(seats)) {
      if (!seat || typeof seat.name !== "string") continue;
      const key = seat.playerId ? `account:${seat.playerId}` : `legacy:${seat.name}`;
      const player = players.get(key) || { count: 0, claimedAt: 0 };
      player.count++;
      const claimedAt = seat.claimedAt || 0;
      if (claimedAt >= player.claimedAt) {
        player.name = seat.name;
        player.color = seat.color;
        player.claimedAt = claimedAt;
      }
      players.set(key, player);
    }
    const sorted = [...players.values()].sort((a, b) => b.count - a.count);
    document.getElementById("people-count").textContent = sorted.length;

    const list = document.getElementById("lb-list");
    list.innerHTML = "";
    sorted.forEach(({ name, color, count }, idx) => {
      const rank = idx + 1;
      const item = document.createElement("div");
      item.className = "lb-item";
      const rankClass = rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : "";
      item.innerHTML = `
        <div class="lb-rank ${rankClass}">${rank}</div>
        <div class="lb-dot"></div>
        <div class="lb-name"></div>
        <div class="lb-count">${count} seats</div>
      `;
      item.querySelector(".lb-dot").style.backgroundColor = color;
      item.querySelector(".lb-name").textContent = name;
      list.appendChild(item);
    });
  }

  function updateStatus() {
    const badge = document.getElementById("status-badge");
    if (isActive) {
      badge.textContent = "Active";
      badge.className = "status-badge active";
    } else {
      badge.textContent = "Stopped";
      badge.className = "status-badge inactive";
    }
  }

  async function accountRequest(user, path, method, body) {
    const idToken = await user.getIdToken();
    const headers = { Authorization: `Bearer ${idToken}` };
    if (body) headers["Content-Type"] = "application/json";
    const res = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || "요청에 실패했습니다. 다시 시도하세요.");
    }
    return data;
  }

  function renderAccount(user) {
    byId("google-login").hidden = !!user;
    byId("google-login").disabled = false;
    byId("account-settings").hidden = !user;
    byId("account-settings").disabled = profileLoading;
    byId("logout").hidden = !user;
    byId("account-summary").hidden = !user;
    byId("account-name").textContent = profile?.nickname || "Google 로그인됨";
    byId("account-color").hidden = !profile;
    byId("account-color").style.backgroundColor = profile?.color || "";
  }

  onAuthStateChanged(auth, async (user) => {
    closeClaimModal();
    closeProfileModal();
    profile = null;
    profileLoading = !!user;
    renderAccount(user);
    if (!user) return;
    try {
      const data = await accountRequest(user, "/profile", "GET");
      if (auth.currentUser !== user) return;
      profile = data.profile;
      byId("account-notice").textContent = profile ? "" : "계정 설정에서 닉네임과 좌석 색상을 저장하세요.";
    } catch (error) {
      if (auth.currentUser === user) byId("account-notice").textContent = error.message;
    } finally {
      if (auth.currentUser === user) {
        profileLoading = false;
        renderAccount(user);
      }
    }
  });

  byId("google-login").addEventListener("click", async () => {
    byId("google-login").disabled = true;
    byId("account-notice").textContent = "";
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (error) {
      const messages = {
        "auth/popup-blocked": "팝업 차단을 해제한 뒤 다시 로그인하세요.",
        "auth/unauthorized-domain": "이 주소에서 Google 로그인을 사용할 수 없습니다.",
        "auth/operation-not-allowed": "Firebase에서 Google 로그인 제공자를 활성화해야 합니다."
      };
      if (error.code !== "auth/popup-closed-by-user") {
        byId("account-notice").textContent = messages[error.code] || "Google 로그인에 실패했습니다. 다시 시도하세요.";
      }
    } finally {
      byId("google-login").disabled = false;
    }
  });

  byId("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      byId("account-notice").textContent = "로그아웃했습니다.";
    } catch {
      byId("account-notice").textContent = "로그아웃하지 못했습니다. 다시 시도하세요.";
    }
  });

  function openProfileModal() {
    if (savingProfile) return;
    byId("nickname").value = profile?.nickname || "";
    byId("seat-color").value = profile?.color || "#00d2d3";
    byId("profile-error").textContent = "";
    byId("profile-modal").classList.add("show");
    byId("nickname").focus();
  }

  function closeProfileModal() {
    byId("profile-modal").classList.remove("show");
  }

  byId("account-settings").addEventListener("click", openProfileModal);
  byId("cancel-profile").addEventListener("click", closeProfileModal);
  byId("profile-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const user = auth.currentUser;
    if (!user || savingProfile) return;
    const nickname = byId("nickname").value.trim();
    const color = byId("seat-color").value;
    if (!nickname) {
      byId("profile-error").textContent = "닉네임을 입력하세요.";
      return;
    }
    savingProfile = true;
    byId("save-profile").disabled = true;
    byId("cancel-profile").disabled = true;
    byId("profile-error").textContent = "";
    try {
      const data = await accountRequest(user, "/profile", "PUT", { nickname, color });
      if (auth.currentUser !== user) return;
      profile = data.profile;
      renderAccount(user);
      closeProfileModal();
      byId("account-notice").textContent = "계정 설정을 저장했습니다.";
    } catch (error) {
      if (auth.currentUser === user) byId("profile-error").textContent = error.message;
    } finally {
      savingProfile = false;
      byId("save-profile").disabled = false;
      byId("cancel-profile").disabled = false;
    }
  });

  function loadTurnstile() {
    if (!turnstileAssets) {
      turnstileAssets = (async () => {
        const res = await fetch("/config");
        const config = await res.json();
        if (!res.ok || !config.turnstileSiteKey) throw new Error("사람 확인이 아직 설정되지 않았습니다.");
        if (!window.turnstile) {
          await new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
            script.onload = resolve;
            script.onerror = () => {
              script.remove();
              reject(new Error("사람 확인을 불러오지 못했습니다. 신청 창을 다시 여세요."));
            };
            document.head.appendChild(script);
          });
        }
        return config.turnstileSiteKey;
      })().catch((error) => {
        turnstileAssets = null;
        throw error;
      });
    }
    return turnstileAssets;
  }

  async function onSeatClick(idx) {
    if (!isActive || seats[idx] || pendingSeat !== null || claimInProgress) return;
    const user = auth.currentUser;
    if (!user) {
      byId("account-notice").textContent = "좌석을 신청하려면 먼저 Google로 로그인하세요.";
      byId("google-login").focus();
      return;
    }
    if (profileLoading) {
      byId("account-notice").textContent = "계정 설정을 불러오는 중입니다.";
      return;
    }
    if (!profile) {
      openProfileModal();
      return;
    }
    const selection = { seatId: idx, user };
    pendingSeat = selection;
    byId("claim-title").textContent = `${idx + 1}번 좌석 신청`;
    byId("claim-name").textContent = profile.nickname;
    byId("claim-color").style.backgroundColor = profile.color;
    byId("claim-error").textContent = "";
    setClaimToken("", "사람 확인을 불러오는 중입니다.");
    byId("claim-modal").classList.add("show");
    byId("cancel-claim").focus();

    try {
      const sitekey = await loadTurnstile();
      if (pendingSeat !== selection) return;
      setClaimToken("", "사람 확인을 진행하고 있습니다.");
      claimWidget = window.turnstile.render("#claim-check", {
        sitekey,
        action: "seat_claim",
        appearance: "interaction-only",
        size: byId("claim-check").clientWidth < 300 ? "compact" : "normal",
        callback: (token) => {
          if (pendingSeat === selection) setClaimToken(token, "사람 확인을 완료했습니다.");
        },
        "expired-callback": () => {
          if (pendingSeat === selection) setClaimToken("", "사람 확인이 만료되어 다시 진행합니다.");
        },
        "error-callback": () => {
          if (pendingSeat === selection) setClaimToken("", "사람 확인에 실패했습니다. 확인이 다시 시작될 때까지 기다려 주세요.");
          return true;
        }
      });
    } catch (error) {
      if (pendingSeat === selection) {
        setClaimToken("", "");
        byId("claim-error").textContent = error.message || "사람 확인을 불러오지 못했습니다.";
      }
    }
  }

  function setClaimToken(token, message) {
    claimToken = token;
    byId("claim-status").textContent = message;
    byId("submit-claim").disabled = claimInProgress || !token;
  }

  function closeClaimModal() {
    pendingSeat = null;
    if (claimWidget !== null) window.turnstile.remove(claimWidget);
    claimWidget = null;
    setClaimToken("", "");
    byId("claim-modal").classList.remove("show");
  }

  byId("cancel-claim").addEventListener("click", closeClaimModal);
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    if (!savingProfile) closeProfileModal();
    if (!claimInProgress) closeClaimModal();
  });

  byId("claim-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const selection = pendingSeat;
    if (!selection || !claimToken || claimInProgress) return;
    const { seatId, user } = selection;
    if (!isActive || seats[seatId]) {
      byId("claim-error").textContent = isActive ? "이미 신청된 좌석입니다." : "게임이 진행 중일 때 신청할 수 있습니다.";
      return;
    }
    if (Date.now() - lastClaimTime < 1000) {
      byId("claim-error").textContent = "잠시 후 다시 신청하세요.";
      return;
    }
    lastClaimTime = Date.now();
    claimInProgress = true;
    byId("submit-claim").disabled = true;
    byId("cancel-claim").disabled = true;
    byId("claim-error").textContent = "";
    try {
      await accountRequest(user, "/claim", "POST", { seatId, turnstileToken: claimToken });
      if (pendingSeat !== selection) return;
      closeClaimModal();
      byId("account-notice").textContent = `${seatId + 1}번 좌석을 신청했습니다.`;
    } catch (error) {
      if (pendingSeat !== selection) return;
      byId("claim-error").textContent = error.message;
      setClaimToken("", "사람 확인을 다시 진행합니다.");
      if (claimWidget !== null) window.turnstile.reset(claimWidget);
    } finally {
      claimInProgress = false;
      byId("cancel-claim").disabled = false;
      byId("submit-claim").disabled = !claimToken;
    }
  });

  // ---- 비밀번호 모달 ----
  function askPassword(action) {
    if (adminInProgress) return;
    pendingAction = action;
    const titles = { start: "Start — Admin Auth", stop: "Stop — Admin Auth", reset: "Reset All — Admin Auth" };
    document.getElementById("pw-modal-title").textContent = titles[action];
    document.getElementById("pw-input").value  = "";
    document.getElementById("pw-error").textContent = "";
    document.getElementById("pw-modal").classList.add("show");
    setTimeout(() => document.getElementById("pw-input").focus(), 100);
  }

  function closePwModal() {
    if (adminInProgress) return;
    document.getElementById("pw-modal").classList.remove("show");
    pendingAction = null;
  }

  async function confirmPassword() {
    const pw     = document.getElementById("pw-input").value;
    const action = pendingAction;
    if (!action || adminInProgress) return;
    adminInProgress = true;
    let succeeded = false;
    try {
      const credential = await signInWithEmailAndPassword(adminAuth, ADMIN_EMAIL, pw);
      await accountRequest(credential.user, `/${action}`, "POST");
      succeeded = true;
    } catch (e) {
      document.getElementById("pw-error").textContent =
        e.code?.startsWith("auth/") ? "관리자 로그인에 실패했습니다." : e.message;
    } finally {
      document.getElementById("pw-input").value = "";
      await signOut(adminAuth);
      adminInProgress = false;
      if (succeeded) closePwModal();
    }
  }

  document.getElementById("pw-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") confirmPassword();
    if (e.key === "Escape") closePwModal();
  });

  // HTML onclick에서 접근할 수 있도록 전역 등록
  window.askPassword    = askPassword;
  window.closePwModal   = closePwModal;
  window.confirmPassword = confirmPassword;
</script>

</body>
</html>
